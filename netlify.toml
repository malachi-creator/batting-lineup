[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Firebase web config is public client-side by design; Vite embeds VITE_* in the bundle.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,FIREBASE_API_KEY,FIREBASE_PROJECT_ID"
  SECRETS_SCAN_OMIT_PATHS = "node_modules/**,netlify-drop/**"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
